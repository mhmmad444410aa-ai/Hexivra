name: Android validation and build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: 4.5.1
      GODOT_ANDROID_KEYSTORE_RELEASE: ${{ github.workspace }}/release.jks
      GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.KEY_ALIAS }}
      GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Godot and templates
        run: |
          base="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable"
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip
          sudo install "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -o templates.tpz
          unzip -q templates.tpz
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mv templates/* "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"
          rm -rf templates templates.tpz godot.zip Godot_v*
      - name: Configure Android
        run: |
          mkdir -p "$HOME/.config/godot"
          printf '[gd_resource type="EditorSettings" format=3]\n\n[resource]\nexport/android/android_sdk_path = "%s"\nexport/android/java_sdk_path = "%s"\n' "$ANDROID_HOME" "$JAVA_HOME" > "$HOME/.config/godot/editor_settings-4.5.tres"
          keytool -genkeypair -keystore "$HOME/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
      - name: Import and test
        run: |
          godot --headless --editor --import --path . --quit
          godot --headless --path . --script res://tests/puzzle_test.gd
          godot --headless --path . --quit-after 10
      - name: Export APK
        run: |
          mkdir -p build
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.jks
            godot --headless --path . --export-release Android build/Hexivra-release.apk
          else
            unset GODOT_ANDROID_KEYSTORE_RELEASE GODOT_ANDROID_KEYSTORE_RELEASE_USER GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD
            godot --headless --path . --export-debug Android build/Hexivra-debug.apk
          fi
          test -n "$(find build -name '*.apk' -size +0c -print -quit)"
          sha256sum build/*.apk > build/SHA256SUMS.txt
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          for apk in build/*.apk; do "$apksigner" verify --print-certs "$apk" > "$apk.cert.txt"; done
      - uses: actions/upload-artifact@v4
        with:
          name: Hexivra-Android
          path: build/
      - name: Remove signing key
        if: always()
        run: rm -f release.jks
